# Golden test set — what a correct answer must contain.
#
# Each case:
#   id, category (current | abolished | tricky | out_of_scope), question
#   must_refuse: true          -> the only correct answer is "I can't confirm this…"
#   expected_sources: [urls]   -> the answer must cite at least ONE of these
#   key_facts: [phrases]       -> ALL must appear in the answer (case-insensitive);
#                                 "a | b" means either phrase counts
#
# Every key fact must appear in at least one of its expected source snapshots
# (checked by tests/test_golden.py), so the set stays grounded in the sources.
# Facts written 2026-11-04 from snapshots fetched 2026-11-03.

