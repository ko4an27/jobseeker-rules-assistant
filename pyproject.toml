[project]
name = "jobseeker-assistant"
version = "0.1.0"
description = "Answers jobseekers' questions about Finnish rules using only official sources, with citations."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
