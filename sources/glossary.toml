# --- Reviewed: official Finnish service names not used on the English pages ---
[[term]]
match = ["palkkatuki"]
means = ["pay subsidy"]
origin = "reviewed"
why = "Official Finnish name of the pay subsidy (Työmarkkinatori's Finnish service page)."

[[term]]
match = ["työkokeilu", "tyokokeilu"]
means = ["work try-out"]
origin = "reviewed"
why = "Official Finnish name of the work try-out."

[[term]]
match = ["työvoimakoulutus"]
means = ["labour market training"]
origin = "reviewed"
why = "Official Finnish name of labour market training."

[[term]]
match = ["soviteltu", "sovittelu"]
means = ["adjusted"]
origin = "reviewed"
why = "Finnish for an adjusted benefit (soviteltu yleistuki = adjusted general social security benefit)."

[[term]]
match = ["te-toimisto", "te-palvelut"]
means = ["TE Office", "TE Services"]
origin = "reviewed"
why = "Finnish names of the old employment office (the English pages say 'TE Office'). English 'TE office' is not listed: it is already the page wording."

# --- Reviewed: everyday words and spellings -> page wording ---
[[term]]
match = ["side gig", "side job", "gig", "odd job", "odd jobs", "extra work"]
means = ["part-time work", "earned income", "wages"]
origin = "reviewed"
why = "Everyday words for working a little while unemployed; Kela calls this part-time work."

[[term]]
match = ["tryout", "try out", "work trial", "trial job"]
means = ["work try-out"]
origin = "reviewed"
why = "Common spellings and names for the work try-out."

[[term]]
match = ["dole", "kela money", "unemployment money"]
means = ["unemployment benefit", "general social security benefit"]
origin = "reviewed"
why = "Everyday words for the unemployment benefit Kela pays."

[[term]]
match = ["move", "moved"]
means = ["transferred"]
origin = "reviewed"
why = "Pages say services were 'transferred' to municipalities."
