# Glossary for query expansion: words people use -> the English terms on the official pages.
# Reviewed 2026-11-04. Used only to find passages; the answer still uses only page text.
#
#   match  = words/phrases in the question (lower case, whole words)
#   means  = English terms used on the pages, added to the search query
#   origin = "source"   -> the page itself pairs the terms, e.g. "general social security
#                          benefit (yleistuki)"; `source` names that page (checked by a test)
#            "reviewed" -> our own mapping, not stated on the English pages; `why` explains it

# --- From the source pages: Kela writes "English term (Finnish term)" ---
[[term]]
match = ["yleistuki"]
means = ["general social security benefit"]
origin = "source"
source = "https://www.kela.fi/if-you-become-unemployed"

[[term]]
match = ["työmarkkinatuki", "tyomarkkinatuki"]
means = ["labour market subsidy"]
origin = "source"
source = "https://www.kela.fi/labour-market-subsidy"

[[term]]
match = ["peruspäiväraha", "peruspaivaraha"]
means = ["basic unemployment allowance"]
origin = "source"
source = "https://www.kela.fi/basic-unemployment-allowance"

[[term]]
match = ["ansiopäiväraha", "ansiosidonnainen"]
means = ["earnings-related unemployment allowance"]
origin = "source"
source = "https://www.kela.fi/if-you-become-unemployed"

[[term]]
match = ["omavastuuaika"]
means = ["waiting period"]
origin = "source"
source = "https://www.kela.fi/during-unemployment"

[[term]]
match = ["odotusaika"]
means = ["qualifying period"]
origin = "source"
source = "https://www.kela.fi/if-you-become-unemployed"

[[term]]
